services:
  agent-ui-dev:
    image: agno-factory-local-agent-ui
    container_name: factory-agent-ui-dev
    working_dir: /ui
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      AGENTOS_URL: http://agentos:7777
    volumes:
      - ../../agent-ui-delivery/src:/ui/src
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - agentos
    networks:
      - factory-net
    profiles:
      - ui-dev
