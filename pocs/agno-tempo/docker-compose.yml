name: agno-factory-tempo
services:
  catalog-export:
    image: agno-factory-tempo-agentos:local
    command: ["python", "/app/integration/export_catalog.py"]
    environment:
      MODEL_ID: ${MODEL_ID}
    volumes:
      - ./integration/export_catalog.py:/app/integration/export_catalog.py:ro
      - ./integration/registry.py:/app/integration/registry.py:ro
      - ./integration/catalog:/app/integration/catalog
      - ./integration/librechat.yaml:/app/integration/librechat.yaml
      - ../../definitions:/app/definitions:ro
      - ./deployment:/app/deployment:ro
    networks: [factory-net]

  backstage-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${BACKSTAGE_DB_PASSWORD}
      POSTGRES_DB: backstage
    volumes:
      - backstage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage -d backstage"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [factory-net]

  backstage:
    image: agno-factory-tempo-backstage:local
    build:
      context: ./backstage
    command: ["sh", "-c", "tar xzf packages/backend/dist/bundle.tar.gz && exec node packages/backend --config app-config.yaml --config app-config.production.yaml"]
    ports:
      - "127.0.0.1:7107:7007"
    environment:
      POSTGRES_HOST: backstage-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${BACKSTAGE_DB_PASSWORD}
    volumes:
      - ./integration/catalog:/catalog:ro
      - ./backstage/app-config.production.yaml:/app/app-config.production.yaml:ro
    depends_on:
      backstage-db:
        condition: service_healthy
      catalog-export:
        condition: service_completed_successfully
    networks: [factory-net]

  agno-gateway:
    image: agno-factory-tempo-agentos:local
    command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      OS_SECURITY_KEY: ${OS_SECURITY_KEY}
      AGENTOS_URL: http://agentos:7777
    volumes:
      - ./integration/gateway.py:/app/gateway.py:ro
      - ./integration/registry.py:/app/integration/registry.py:ro
      - ../../definitions:/app/definitions:ro
      - ./deployment:/app/deployment:ro
      - ./swarm-output:/data:ro
    ports:
      - "127.0.0.1:7878:8080"
    depends_on: [agentos]
    networks: [factory-net]

  librechat-mongodb:
    image: mongo:8.0.20
    volumes:
      - librechat_mongo:/data/db
    networks: [factory-net]

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    ports:
      - "127.0.0.1:3090:3080"
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      DOMAIN_CLIENT: http://localhost:3090
      DOMAIN_SERVER: http://localhost:3090
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      OS_SECURITY_KEY: ${OS_SECURITY_KEY}
      ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      SEARCH: "false"
      SCHEDULES_SINGLE_PROCESS: "true"
    volumes:
      - ./integration/librechat.yaml:/app/librechat.yaml:ro
      - librechat_data:/app/data
      - librechat_uploads:/app/uploads
      - librechat_images:/app/client/public/images
    depends_on:
      librechat-mongodb:
        condition: service_started
      agno-gateway:
        condition: service_started
      catalog-export:
        condition: service_completed_successfully
    networks: [factory-net]

  # ==========================================
  # 1. Agno 狀態與向量資料庫 (PostgreSQL + pgvector)
  # ==========================================
  agno-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    volumes:
      - agno_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - factory-net

  # ==========================================
  # 2. Agno AgentOS 後端執行層
  # ==========================================
  agentos:
    image: agno-factory-tempo-agentos:local
    build:
      context: .
      dockerfile: Dockerfile.agentos
    ports:
      - "127.0.0.1:7877:7777"
    environment:
      DATABASE_URL: postgresql+psycopg://ai:ai@agno-db:5432/ai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL_ID: ${MODEL_ID}
      OS_SECURITY_KEY: ${OS_SECURITY_KEY}
      AGNO_TELEMETRY: "false"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agno-tempo-agentos}
      AGENTOS_URL: http://agentos:7777
      TEMPO_QUERY_URL: http://tempo:3200
    volumes:
      - ./app.py:/app/app.py
      - ../../scenarios:/app/scenarios:ro
      - ../../scenarios/pay-482/payment_demo.py:/app/payment_demo.py:ro
      - ../../scenarios/pay-482/pay482_evidence.py:/app/pay482_evidence.py:ro
      - ../../scenarios/pay-482/test_payment_demo.py:/app/test_payment_demo.py:ro
      - ../../benchmark:/app/benchmark:ro
      - ./test_native_workflows.py:/app/test_native_workflows.py:ro
      - ./native_workflows.py:/app/native_workflows.py:ro
      - ./integration/registry.py:/app/integration/registry.py:ro
      - ../../definitions:/app/definitions:ro
      - ./deployment:/app/deployment:ro
      - ./native_demo_run.py:/app/native_demo_run.py:ro
      - ./tempo_traces.py:/app/tempo_traces.py:ro
      - ./native_report.py:/app/native_report.py:ro
      - ./native_report_template.html:/app/native_report_template.html:ro
      - ./swarm-output:/app/swarm-output
    depends_on:
      agno-db:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - factory-net

  # ==========================================
  # 3. 開源版 Agno Agent UI (Next.js 前端)
  # ==========================================
  agent-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        NEXT_PUBLIC_OS_SECURITY_KEY: ${OS_SECURITY_KEY}
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      NEXT_PUBLIC_OS_SECURITY_KEY: ${OS_SECURITY_KEY}
    depends_on:
      - agentos
    networks:
      - factory-net

  tempo:
    image: grafana/tempo:3.0.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4318"
    networks: [factory-net]

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    networks: [factory-net]
networks:
  factory-net:
    driver: bridge

volumes:
  tempo_data:
  grafana_data:
  backstage_pgdata:
  librechat_mongo:
  librechat_data:
  librechat_uploads:
  librechat_images:
  agno_pgdata:
