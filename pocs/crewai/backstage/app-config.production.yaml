app:
  title: CrewAI Factory Catalog
  baseUrl: http://localhost:7008
integrations:
  github: []
backend:
  baseUrl: http://localhost:7008
  listen: ':7007'
  cors:
    origin: http://localhost:7008
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User]
  locations:
    - type: file
      target: /catalog/entities.yaml
